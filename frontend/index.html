<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CASA-AI Pro | Computer Assisted Semen Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Gaya loading ditulis di sini agar langsung tampil saat refresh, sebelum CSS aplikasi dimuat -->
    <style>
      .app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: rgba(255, 255, 255, 0.55);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      html[data-theme='dark'] .app-loader {
        background: rgba(0, 0, 0, 0.6);
      }
      .app-loader.is-visible {
        opacity: 1;
        visibility: visible;
      }
      .app-loader-logos {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .app-loader-logos img {
        height: 56px;
        width: auto;
        max-width: 84px;
        object-fit: contain;
        animation: app-loader-bounce 1.2s ease-in-out infinite;
      }
      .app-loader-logos img:nth-child(2) { animation-delay: 0.15s; }
      .app-loader-logos img:nth-child(3) { animation-delay: 0.3s; }
      .app-loader-bar {
        width: 160px;
        height: 4px;
        border-radius: 999px;
        background: rgba(0, 175, 160, 0.18);
        overflow: hidden;
        position: relative;
      }
      .app-loader-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #00AFA0, #C1D72E);
        animation: app-loader-slide 1s ease-in-out infinite;
      }
      .app-loader-text {
        font-size: 0.8rem;
        font-weight: 600;
        color: #6B7280;
        letter-spacing: 0.04em;
      }
      @keyframes app-loader-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes app-loader-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loader-logos img,
        .app-loader-bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-loader" class="app-loader is-visible" role="status" aria-live="polite">
      <div class="app-loader-logos">
        <img src="/logos/pnl.png" alt="Politeknik Negeri Lhokseumawe" />
        <img src="/logos/infest.png" alt="INFEST" />
        <img src="/logos/casaai.png" alt="CASA-AI" />
      </div>
      <div class="app-loader-bar"></div>
      <span class="app-loader-text">Memuat...</span>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
